<!doctype html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Courses - Noor Express</title>
  <link rel="stylesheet" href="assets/style.css">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
</head>
<body data-active-page="rides">
  <aside class="sidebar" data-admin-sidebar></aside>
  <main class="content">
    <div class="page-head">
      <div>
        <h1>Courses</h1>
        <p class="hint">Suivi opérationnel des demandes et courses.</p>
      </div>
      <button onclick="AdminApi.loadRides()">Actualiser</button>
    </div>

    <section class="panel">
      <div class="toolbar">
        <label>Statut
          <select id="status-filter" onchange="AdminApi.renderRides()">
            <option value="">Tous statuts</option>
            <option value="pending">En attente</option>
            <option value="offered">Offres reçues</option>
            <option value="accepted">Acceptée</option>
            <option value="started">En cours</option>
            <option value="completed">Terminée</option>
            <option value="cancelled">Annulée</option>
          </select>
        </label>
        <label>Date
          <input id="ride-date-filter" type="date" onchange="AdminApi.renderRides()">
        </label>
        <label>Année archive
          <input data-archive-year type="number" min="2020" max="2100" placeholder="2025" onchange="AdminApi.renderRides()">
        </label>
        <label>Mois
          <select data-archive-month onchange="AdminApi.renderRides()">
            <option value="">Tous les mois</option>
            <option value="01">Janvier</option><option value="02">Février</option><option value="03">Mars</option>
            <option value="04">Avril</option><option value="05">Mai</option><option value="06">Juin</option>
            <option value="07">Juillet</option><option value="08">Août</option><option value="09">Septembre</option>
            <option value="10">Octobre</option><option value="11">Novembre</option><option value="12">Décembre</option>
          </select>
        </label>
      </div>
      <table>
        <thead>
          <tr><th>ID</th><th>Client</th><th>Chauffeur</th><th>Statut</th><th>Prix</th><th>Distance</th><th>Durée</th><th>Signalements</th><th></th></tr>
        </thead>
        <tbody id="rides-table"></tbody>
      </table>
      <div id="rides-pagination" class="table-footer"></div>
    </section>
  </main>

  <dialog id="ride-detail-modal">
    <div class="modal-form">
      <h2>Détail course</h2>
      <div id="ride-detail-content"></div>
      <div class="actions"><button class="ghost" onclick="AdminApi.closeRideDetail()">Fermer</button></div>
    </div>
  </dialog>

  <dialog id="reports-modal">
    <div class="modal-form">
      <h2>Signalements de la course</h2>
      <div id="reports-modal-content"></div>
      <div class="actions"><button class="ghost" onclick="AdminApi.closeReportsModal()">Fermer</button></div>
    </div>
  </dialog>
  <script src="assets/admin-ui.js?v=20260425-admin-v2"></script>
  <script src="assets/api.js?v=20260425-admin-v2"></script>
  <script>AdminApi.requireAuth(); AdminApi.loadRides();</script>
</body>
</html>
