<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Paiements - Noor Express</title>
  <link rel="stylesheet" href="assets/style.css">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
</head>
<body data-active-page="payments">
  <aside class="sidebar" data-admin-sidebar></aside>
  <main class="content">
    <div class="page-head">
      <div>
        <h1>Paiements</h1>
        <p class="hint">Ledger reel des courses terminees et commissions admin.</p>
      </div>
      <button onclick="AdminApi.exportPaymentsCsv()">Export CSV</button>
    </div>
    <section id="payments-metrics" class="metrics-grid"></section>
    <section class="panel">
      <div class="toolbar">
        <label>Chauffeur
          <select id="payments-driver-filter" onchange="AdminApi.loadPayments()">
            <option value="">Tous les chauffeurs</option>
          </select>
        </label>
        <label>Année archive
          <input data-archive-year type="number" min="2020" max="2100" placeholder="2025" onchange="AdminApi.loadPayments()">
        </label>
        <label>Mois
          <select data-archive-month onchange="AdminApi.loadPayments()">
            <option value="">Tous les mois</option>
            <option value="01">Janvier</option><option value="02">Février</option><option value="03">Mars</option>
            <option value="04">Avril</option><option value="05">Mai</option><option value="06">Juin</option>
            <option value="07">Juillet</option><option value="08">Août</option><option value="09">Septembre</option>
            <option value="10">Octobre</option><option value="11">Novembre</option><option value="12">Décembre</option>
          </select>
        </label>
      </div>
      <table>
        <thead><tr><th>ID course</th><th>Client</th><th>Chauffeur</th><th>Statut</th><th>Total cash</th><th>Commission admin</th></tr></thead>
        <tbody id="payments-table"></tbody>
      </table>
    </section>
  </main>
  <script src="assets/admin-ui.js?v=20260425-admin-v2"></script>
  <script src="assets/api.js?v=20260425-admin-v2"></script>
  <script>AdminApi.requireAuth(); AdminApi.loadPayments();</script>
</body>
</html>
